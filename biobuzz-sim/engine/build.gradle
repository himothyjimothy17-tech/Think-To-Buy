// The simulator engine: physics, rules, OpMode runner and web server.
plugins { id 'java' }

dependencies {
    implementation project(':sdk-mock')
    // Our TeamCode is on the classpath so the sim can find and run its OpModes.
    implementation project(':teamcode')

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Long-running experiments (shooting range maps, PID sweeps) only run on request:
    //   ./gradlew :engine:experiment --tests '*ShootingRange*'
    useJUnitPlatform { excludeTags 'experiment' }
    workingDir = rootProject.projectDir   // so tests find config/
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// ./gradlew sim  -> starts the visual simulator and opens the browser.
// Extra options:  ./gradlew sim --args="--variant hood --no-browser"
tasks.register('sim', JavaExec) {
    group = 'biobuzz'
    description = 'Run the visual BIOBUZZ simulator (opens http://127.0.0.1:8765/)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.biobuzz.sim.Main'
    workingDir = rootProject.projectDir
    standardInput = System.in
}

// Runs the tagged experiments (they print tables instead of pass/fail).
tasks.register('experiment', Test) {
    group = 'biobuzz'
    description = 'Run simulator experiments (shooting range, PID tuning)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'experiment' }
    workingDir = rootProject.projectDir
    testLogging { showStandardStreams = true; events 'failed' }
}

// ./gradlew headless --args="--auto 'BIOBUZZ Auto' --seeds 1-20"
// Runs matches with no browser and saves a JSON report in runs/.
// See Headless.java for every option (comparisons use "|", e.g. --variant "gate|hood").
tasks.register('headless', JavaExec) {
    group = 'biobuzz'
    description = 'Run matches headless over many seeds and print/save the numbers'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.biobuzz.sim.Headless'
    workingDir = rootProject.projectDir
}

tasks.register('printCp') {
    doLast { println sourceSets.main.runtimeClasspath.asPath }
}
